#docker-compose.yml for local development
version: '3'

services:
  app:
    build: .
    container_name: app
    ports:
      - "5001:5000"
    volumes:
      - .:/app                  # Mount full project
    working_dir: /app           # Use project root
    environment:
      - PYTHONPATH=/app         # Lets 'from app.inference import ...' work
      - FLASK_ENV=development
      - FLASK_DEBUG=True
      - PORT=5000
    env_file: .env