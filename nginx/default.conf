# Redirect non-www to www
server {
    listen 80;
    server_name pincheck.net;
    return 301 https://www.pincheck.net$request_uri;
}

# Redirect HTTP www to HTTPS www
server {
    listen 80;
    server_name www.pincheck.net;

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS for www.pincheck.net
server {
    listen 443 ssl;
    server_name www.pincheck.net;

    ssl_certificate /etc/letsencrypt/live/pincheck.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pincheck.net/privkey.pem;

    client_max_body_size 10M;

    location / {
        proxy_pass http://app:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
